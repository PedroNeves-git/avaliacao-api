# ── Deploy no Azure Functions ────────────────────────────────────────────────
quarkus.azure-functions.app-name=fn-relatorio-semanal
quarkus.azure-functions.resource-group=rg-tech-challenge
quarkus.azure-functions.region=southcentralus

# ── Banco de dados (Azure SQL Database — schema T-SQL em db/schema.sql) ──────
# Em produção tudo vem de variáveis de ambiente; a JDBC URL usa
# jdbc:sqlserver://...;encrypt=true (exigido pelo Azure SQL).
# Em dev/test as propriedades ficam sem valor de propósito: os Dev Services do
# Quarkus sobem um SQL Server em container (Testcontainers) automaticamente.
quarkus.datasource.db-kind=mssql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=2

# Schema criado no SQL Server dos testes de integração
%test.quarkus.datasource.devservices.image-name=mcr.microsoft.com/mssql/server:2022-latest
%test.quarkus.datasource.devservices.init-script-path=db/init.sql

# ── Azure Blob Storage ───────────────────────────────────────────────────────
%prod.azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=relatorios
# Valor dummy para dev/test: o cliente só é criado no momento do upload,
# então nenhuma credencial real é necessária fora de produção.
%dev.azure.storage.connection-string=UseDevelopmentStorage=true
%test.azure.storage.connection-string=UseDevelopmentStorage=true
